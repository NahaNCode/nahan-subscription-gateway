name: Gateway Checks And Release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 -m py_compile install.py deploy/release.py
      - run: python3 -m unittest -v install_test.py
      - run: sh -n install.sh
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/nahancode/nahan-subscription-gateway:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/NahaNCode/nahan-subscription-gateway
      - run: python3 deploy/release.py "ghcr.io/nahancode/nahan-subscription-gateway@${{ steps.image.outputs.digest }}"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "NahaN Subscription Gateway $GITHUB_REF_NAME" --notes-file docs/release-v0.1.2.md
